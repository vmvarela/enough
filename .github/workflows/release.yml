name: release
on:
  push:
    tags: ["v*"]
    branches: ["release/v*"]
permissions:
  contents: write
jobs:
  release:
    env:
      RELEASE_REF: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Select release tag
        run: echo "RELEASE_TAG=${RELEASE_REF#release/}" >> "$GITHUB_ENV"
      - name: Build single binaries
        shell: bash
        run: |
          mkdir -p release
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            export GOOS="${platform%/*}" GOARCH="${platform#*/}" CGO_ENABLED=0
            name="enough_${GOOS}_${GOARCH}"
            suffix=""
            if [ "$GOOS" = windows ]; then suffix=".exe"; fi
            go build -trimpath -ldflags="-s -w -X main.version=${RELEASE_TAG#v}" -o "release/${name}${suffix}" ./cmd/enough
          done
          cd release
          sha256sum enough_* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
